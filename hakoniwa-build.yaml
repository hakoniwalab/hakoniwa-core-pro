# User-facing build capacity configuration for hakoniwa-core-pro.
# tools/hako.py validates this file and generates a native-compatible
# .hako/hako_build_defaults.conf for the existing build drivers.
version: 1

limits:
  asset_num: 16
  pdu_channel_max: 8192
  recv_event_max: 4096
  service_client_max: 256
  service_max: 1024
  client_name_len_max: 64
  service_name_len_max: 128

# Keep the legacy untagged hakopy artifact by default. Foundation builds set
# this to true so incompatible CPython ABIs fail safely at import discovery.
python:
  soabi: false

# Direct Core PRO builds keep the full validation profile. Foundation adapters
# may disable Component tests in their generated build-input manifest.
validation:
  tests: true
